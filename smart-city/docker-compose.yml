services:
  identity-service:
    build: ./services/identity-service
    environment:
      SERVICE_NAME: identity-service
      DATABASE_URL: sqlite:////data/identity.db
      JWT_SECRET: ${JWT_SECRET:-development-jwt-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8001:8000"
    volumes:
      - identity-data:/data

  transport-service:
    build: ./services/transport-service
    environment:
      SERVICE_NAME: transport-service
      DATABASE_URL: sqlite:////data/transport.db
      JWT_SECRET: ${JWT_SECRET:-development-jwt-secret}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-development-service-token}
      NOTIFICATION_URL: http://notification-service:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8002:8000"
    volumes:
      - transport-data:/data
    depends_on:
      - notification-service

  utility-service:
    build: ./services/utility-service
    environment:
      SERVICE_NAME: utility-service
      DATABASE_URL: sqlite:////data/utility.db
      JWT_SECRET: ${JWT_SECRET:-development-jwt-secret}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-development-service-token}
      NOTIFICATION_URL: http://notification-service:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8003:8000"
    volumes:
      - utility-data:/data
    depends_on:
      - notification-service

  environment-service:
    build: ./services/environment-service
    environment:
      SERVICE_NAME: environment-service
      DATABASE_URL: sqlite:////data/environment.db
      SENSOR_API_KEY: ${SENSOR_API_KEY:-demo-sensor-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8004:8000"
    volumes:
      - environment-data:/data

  billing-service:
    build: ./services/billing-service
    environment:
      SERVICE_NAME: billing-service
      DATABASE_URL: sqlite:////data/billing.db
      JWT_SECRET: ${JWT_SECRET:-development-jwt-secret}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-development-service-token}
      DEMO_PAYMENTS_ENABLED: ${DEMO_PAYMENTS_ENABLED:-true}
      NOTIFICATION_URL: http://notification-service:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8005:8000"
    volumes:
      - billing-data:/data
    depends_on:
      - notification-service

  notification-service:
    build: ./services/notification-service
    environment:
      SERVICE_NAME: notification-service
      DATABASE_URL: sqlite:////data/notification.db
      SERVICE_TOKEN: ${SERVICE_TOKEN:-development-service-token}
    ports:
      - "8006:8000"
    volumes:
      - notification-data:/data

  frontend:
    build: ./frontend
    environment:
      VITE_IDENTITY_API_URL: http://localhost:8001
      VITE_TRANSPORT_API_URL: http://localhost:8002
      VITE_UTILITY_API_URL: http://localhost:8003
      VITE_ENVIRONMENT_API_URL: http://localhost:8004
      VITE_BILLING_API_URL: http://localhost:8005
    ports:
      - "5173:5173"
    depends_on:
      - identity-service
      - transport-service
      - utility-service
      - environment-service
      - billing-service

volumes:
  identity-data:
  transport-data:
  utility-data:
  environment-data:
  billing-data:
  notification-data:
